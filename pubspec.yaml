name: linguareader
description: A PDF-based language learning app.
publish_to: "none"
version: 1.1.2+14

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Auth & Backend
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1

  # Subscriptions
  purchases_flutter: ^9.13.0

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # PDF
  flutter_pdfview: ^1.3.2

  # Networking
  http: ^1.2.0
  html: ^0.15.4
  flutter_markdown: ^0.7.7+1

  # AI
  google_generative_ai: ^0.4.3

  # UI/Icons
  cupertino_icons: ^1.0.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.2
  file_picker: ^10.3.8
  syncfusion_flutter_pdf: ^32.1.24
  syncfusion_flutter_pdfviewer: ^32.1.24
  share_plus: ^12.0.1
  fl_chart: ^0.66.0
  url_launcher: ^6.2.4
  google_fonts: ^8.0.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  just_audio: ^0.10.5
  spotify_sdk: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.7
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/pdf_cover_placeholder.png
    - assets/tutorial_getting_started.pdf
    - assets/fox_tutorial/
    - assets/fox/
    - assets/fox/rotations/
    - assets/fox/animations/walk-8-frames/east/
    - assets/fox/animations/walk-8-frames/west/
    - assets/fox/animations/seated-on-belly-idle/south/
    - assets/fox/animations/yawning/south/
    - assets/fox/animations/yawning/east/
    - assets/fox/animations/yawning/west/
    - assets/fox/animations/jump/south/
    - assets/fox/animations/jump/east/
    - assets/fox/animations/jump/west/

dependency_overrides:
  syncfusion_flutter_pdfviewer:
    path: packages/syncfusion_flutter_pdfviewer
  syncfusion_pdfviewer_platform_interface:
    path: packages/syncfusion_pdfviewer_platform_interface
