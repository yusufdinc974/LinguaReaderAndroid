name: Android build

# Builds the app on every push and pull request, and keeps the debug APK as a
# download (Actions → this run → Artifacts → linguareader-debug-apk) to install
# on a phone for testing. Store builds (signed AAB) come later.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Type check and web build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: linguareader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
